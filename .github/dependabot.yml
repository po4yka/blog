version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /.claude/cms-mcp
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing a new release, so a compromised publish is usually pulled
    # before it reaches a PR. Security updates are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
    open-pull-requests-limit: 10
    ignore:
      # Transitive only, kept on 7.x by an override; tooling does not support Babel 8 yet.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
      tanstack:
        patterns:
          - "@tanstack/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/playwright
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
