name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every push to main gets its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A registry proxy (e.g. `safety npm`) can write its own tarball URLs into the lockfiles.
      - name: Check lockfiles resolve from registry.npmjs.org
        run: |
          if grep -Hn '"resolved": "' package-lock.json .claude/cms-mcp/package-lock.json | grep -v '"https://registry.npmjs.org/'; then
            echo "::error::Lockfile entries above resolve outside registry.npmjs.org. Reinstall with plain npm."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify CMS MCP server
        run: |
          npm ci --ignore-scripts --prefix .claude/cms-mcp
          npm run test:mcp-http
          npm test --prefix .claude/cms-mcp
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --coverage

  # The only build. Every later job tests or deploys this same dist/.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: the changelog and build metadata generators read git log.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          # astro preview finds the build through .wrangler/deploy/config.json, so it travels with dist/.
          path: |
            dist/
            .wrangler/deploy/config.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: .
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium webkit firefox
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload E2E test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: .
      - name: Run Lighthouse CI (desktop)
        run: npx lhci autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
      - name: Run Lighthouse CI (mobile)
        if: ${{ !cancelled() }}
        run: npx lhci autorun --config=.lighthouserc.mobile.json
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 7

  # Screenshot baselines are Linux-only. The runner image is pinned (not ubuntu-latest) so system fonts
  # stay the same between runs; the browser is the one @playwright/test pins in package-lock.json.
  # The Playwright container image is not used: the Cloudflare prerenderer's workerd does not start in it.
  visual:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: .
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - name: Run visual regression tests
        run: npx playwright test --project=visual
        env:
          VISUAL: "1"
      # On a first run or a deliberate change, the written snapshots are the new baselines to commit.
      - name: Upload visual diffs and snapshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: |
            test-results/
            e2e/visual.spec.ts-snapshots/
          retention-days: 7

  deploy:
    needs: [checks, e2e, lighthouse, visual]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploys run one at a time and are never cancelled midway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A run for an older commit can finish after a newer one; it must not overwrite the newer deploy.
      - name: Check that this commit is still the head of main
        id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy: main moved to $head"
          fi
      - if: steps.head.outputs.latest == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Installs the wrangler version locked in package-lock.json.
      - if: steps.head.outputs.latest == 'true'
        run: npm ci
      - if: steps.head.outputs.latest == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: .
      - if: steps.head.outputs.latest == 'true'
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Telemetry bookkeeping below runs after the Worker is live, so its failures are marked on the
      # step but never fail the deploy job.
      - if: steps.head.outputs.latest == 'true'
        name: Record the deploy for the Telemetry page
        continue-on-error: true
        run: |
          npx wrangler d1 execute blog-db --remote --yes --file db/migrations/008_telemetry_history.sql
          npx wrangler d1 execute blog-db --remote --yes --command "INSERT OR REPLACE INTO deploys (commit_sha, deployed_at) VALUES ('$GITHUB_SHA', datetime('now'))"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The admin mirrors repo content: reload D1 from the generated seed. D1 runs a --file import atomically.
      - if: steps.head.outputs.latest == 'true'
        run: npx wrangler d1 execute blog-db --remote --yes --file db/seed.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Keep this deploy's Lighthouse results in D1 for the admin Telemetry page (page speed per deploy).
      - if: steps.head.outputs.latest == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lighthouse-reports
          path: lighthouse-reports
      - if: steps.head.outputs.latest == 'true'
        name: Store Lighthouse results in D1
        continue-on-error: true
        run: |
          npx tsx scripts/lighthouse-to-sql.ts lighthouse-reports "$GITHUB_SHA" > lighthouse.sql
          npx wrangler d1 execute blog-db --remote --yes --file lighthouse.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
