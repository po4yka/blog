      <title id="04-policy-state-machine-desktop-policy-state-machine-title">The remembered-policy state machine</title>
      <desc id="04-policy-state-machine-desktop-policy-state-machine-desc">State machine of the remembered per-network policy. States observed, validated, suppressed. A new scope enters observed, validates to validated, and a success self-loops there. Two consecutive failures of a validated policy move it to suppressed with a 24-hour lock; any success or lock expiry returns it to validated. The scope key is a SHA-256 hash; the store keeps at most 64 rows and forgets entries older than 90 days.</desc>

        </marker>
        <marker id="04-policy-state-machine-desktop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="var(--dg-accent)"/>
        </marker>
      </defs>

      <rect x="0.5" y="0.5" width="959" height="383" rx="2" fill="var(--dg-card)" stroke="var(--dg-rule)" stroke-width="1"/>

      <!-- ── Header row ────────────────────────────────────────────────── -->
      <text x="24" y="25" fill="var(--dg-muted)" font-size="14" font-weight="500" font-family="var(--dg-mono)" letter-spacing="0.12em">FIG 05 / WHAT THE PHONE REMEMBERS</text>
      <text x="936" y="25" fill="var(--dg-soft)" font-size="13" font-family="var(--dg-mono)" text-anchor="end">RIPDPI · REMEMBERED NETWORK POLICY</text>
      <line x1="16" y1="40" x2="944" y2="40" stroke="rgba(var(--dg-ink-rgb),0.12)" stroke-width="1"/>
      <path d="M12 40H20M16 36V44" stroke="rgba(var(--dg-ink-rgb),0.35)" stroke-width="1" fill="none"/>
      <path d="M940 40H948M944 36V44" stroke="rgba(var(--dg-ink-rgb),0.35)" stroke-width="1" fill="none"/>

      <!-- ── Edges (drawn before nodes) ────────────────────────────────── -->

      <!-- start → observed -->
      <g data-edge="new-scope">
        <line x1="44" y1="166" x2="148" y2="166" stroke="var(--dg-muted)" stroke-width="1" marker-end="url(#04-policy-state-machine-desktop-arrow)"/>
        <rect x="50" y="146" width="96" height="14" fill="var(--dg-card)"/>
        <text x="98" y="156" fill="var(--dg-soft)" font-size="10" font-family="var(--dg-mono)" text-anchor="middle" letter-spacing="0.08em">NEW SCOPE</text>
      </g>

      <!-- observed → validated -->
      <g data-edge="validates">
        <line x1="320" y1="166" x2="420" y2="166" stroke="var(--dg-muted)" stroke-width="1" marker-end="url(#04-policy-state-machine-desktop-arrow)"/>
        <rect x="326" y="146" width="88" height="14" fill="var(--dg-card)"/>
        <text x="370" y="156" fill="var(--dg-soft)" font-size="10" font-family="var(--dg-mono)" text-anchor="middle" letter-spacing="0.08em">VALIDATES</text>
      </g>

      <!-- validated self-loop -->
      <g data-edge="success-loop">
        <path d="M480 136V112Q480 104 488 104H528Q536 104 536 112V132" fill="none" stroke="var(--dg-muted)" stroke-width="1" marker-end="url(#04-policy-state-machine-desktop-arrow)"/>
        <rect x="468" y="80" width="80" height="14" fill="var(--dg-card)"/>
        <text x="508" y="90" fill="var(--dg-soft)" font-size="10" font-family="var(--dg-mono)" text-anchor="middle" letter-spacing="0.08em">ANY SUCCESS</text>
      </g>

      <!-- validated → suppressed (focal transition) -->
      <g data-edge="fail-lock">
        <line x1="592" y1="166" x2="700" y2="166" stroke="var(--dg-accent)" stroke-width="1" marker-end="url(#04-policy-state-machine-desktop-arrow-accent)"/>
        <rect x="600" y="132" width="96" height="28" fill="var(--dg-card)"/>
        <text x="648" y="142" fill="var(--dg-accent)" font-size="10" font-family="var(--dg-mono)" text-anchor="middle" letter-spacing="0.08em">2 CONSEC.</text>
        <text x="648" y="156" fill="var(--dg-accent)" font-size="10" font-family="var(--dg-mono)" text-anchor="middle" letter-spacing="0.08em">FAILURES</text>
        <rect x="608" y="172" width="80" height="14" fill="var(--dg-card)"/>
        <text x="648" y="182" fill="var(--dg-accent)" font-size="10" font-family="var(--dg-mono)" text-anchor="middle" letter-spacing="0.08em">LOCK 24h</text>

        <rect x="520" y="258" width="228" height="14" fill="var(--dg-card)"/>
        <text x="634" y="268" fill="var(--dg-soft)" font-size="10" font-family="var(--dg-mono)" text-anchor="middle" letter-spacing="0.08em">ANY SUCCESS OR LOCK EXPIRES</text>
      </g>

      <!-- ── Nodes ─────────────────────────────────────────────────────── -->

      <!-- start -->
      <circle cx="36" cy="166" r="6" fill="var(--dg-ink)"/>

      <!-- observed -->
      <g data-node="observed">
        <rect x="152" y="136" width="168" height="60" rx="2" fill="var(--dg-card)"/>
        <rect x="152" y="136" width="168" height="60" rx="2" fill="var(--dg-paper)" stroke="rgba(var(--dg-ink-rgb),0.30)" stroke-width="1"/>
        <text x="164" y="152" fill="var(--dg-soft)" font-size="9.5" font-weight="500" font-family="var(--dg-mono)" letter-spacing="0.10em">STATE</text>
        <text x="164" y="174" fill="var(--dg-ink)" font-size="13" font-weight="500" font-family="var(--dg-mono)">observed</text>
      </g>

      <!-- validated (primary) -->
      <g data-node="validated">
        <rect x="424" y="136" width="168" height="60" rx="2" fill="var(--dg-card)"/>
        <rect x="424" y="136" width="168" height="60" rx="2" fill="var(--dg-paper)" stroke="var(--dg-ink)" stroke-width="1"/>
        <text x="436" y="152" fill="var(--dg-soft)" font-size="9.5" font-weight="500" font-family="var(--dg-mono)" letter-spacing="0.10em">STATE</text>
        <text x="436" y="174" fill="var(--dg-ink)" font-size="13" font-weight="500" font-family="var(--dg-mono)">validated</text>
      </g>

      <!-- suppressed (focal) -->
      <g data-node="suppressed">
        <rect x="704" y="136" width="232" height="60" rx="2" fill="var(--dg-card)"/>
        <rect x="704" y="136" width="232" height="60" rx="2" fill="rgba(var(--dg-accent-rgb),0.08)" stroke="var(--dg-accent)" stroke-width="1"/>
        <text x="716" y="152" fill="var(--dg-accent)" font-size="9.5" font-weight="500" font-family="var(--dg-mono)" letter-spacing="0.10em">STATE</text>
        <text x="716" y="170" fill="var(--dg-ink)" font-size="13" font-weight="500" font-family="var(--dg-mono)">suppressed</text>
        <text x="716" y="186" fill="var(--dg-accent)" font-size="10" font-family="var(--dg-mono)">suppressedUntil = failedAt + 24h</text>
      </g>

      <!-- ── Footer ────────────────────────────────────────────────────── -->
      <line x1="16" y1="300" x2="944" y2="300" stroke="rgba(var(--dg-ink-rgb),0.12)" stroke-width="1"/>
      <text x="24" y="324" fill="var(--dg-soft)" font-size="10" font-weight="500" font-family="var(--dg-mono)" letter-spacing="0.16em">RETENTION</text>
      <text x="128" y="324" fill="var(--dg-muted)" font-size="12.5" font-family="var(--dg-sans)">At most 64 rows total; entries older than 90 days are forgotten automatically.</text>
      <text x="24" y="348" fill="var(--dg-soft)" font-size="10" font-weight="500" font-family="var(--dg-mono)" letter-spacing="0.16em">PRIVACY</text>
      <text x="128" y="348" fill="var(--dg-muted)" font-size="12.5" font-family="var(--dg-sans)">Scope key is a SHA-256 hash.</text>
      <text x="128" y="364" fill="var(--dg-muted)" font-size="12.5" font-family="var(--dg-sans)">Raw SSID/BSSID are kept out of logs and crash reports and never leave the device.</text>
      <text x="936" y="364" fill="var(--dg-soft)" font-size="11" font-family="var(--dg-mono)" text-anchor="end">RememberedNetworkPolicyStore · Room</text>
    </svg></div><div class="diagram-controls" role="group" aria-label="Events"><button type="button" class="diagram-chip" data-event="0" aria-keyshortcuts="S 1"><span class="diagram-key" aria-hidden="true">S</span>Success</button><button type="button" class="diagram-chip" data-event="1" aria-keyshortcuts="F 2"><span class="diagram-key" aria-hidden="true">F</span>Failure</button><button type="button" class="diagram-chip" data-event="2" aria-keyshortcuts="T 3"><span class="diagram-key" aria-hidden="true">T</span>24 h pass</button><button type="button" class="diagram-chip" data-event="3" aria-keyshortcuts="R 0"><span class="diagram-key" aria-hidden="true">R</span>New scope</button></div><div class="diagram-foot"><span class="diagram-hint"><span data-hint="keys">Letters on the chips · ← → choose · ↵ fires</span><span data-hint="touch">Tap an event</span></span><span class="diagram-readout" data-readout aria-live="polite">OBSERVED · not validated yet</span></div></div>
